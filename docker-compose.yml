services:
  haproxy:
    container_name: haproxy
    image: haproxy:3.0-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api1
      - api2
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "32MB"

  api1:
    container_name: api-1
    build: .
    environment:
      LISTEN_ADDR: ":8080"
      REDIS_ADDR: "valkey:6379"
      GOMAXPROCS: "1"
      WORKERS: "64"
      MAX_PROCESSOR_CONNS: "100"
      PROCESSOR_TIMEOUT_MS: "10000"
      PROCESSING_LEASE_MS: "25000"
      PROCESSOR_HEALTH_GRACE_MS: "1200"
      FALLBACK_QUEUE_SIZE: "200"
      PROCESSOR_DEFAULT_URL: "http://payment-processor-default:8080"
      PROCESSOR_FALLBACK_URL: "http://payment-processor-fallback:8080"
    depends_on:
      - valkey
    networks:
      - backend
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "80MB"

  api2:
    container_name: api-2
    build: .
    environment:
      LISTEN_ADDR: ":8080"
      REDIS_ADDR: "valkey:6379"
      GOMAXPROCS: "1"
      WORKERS: "64"
      MAX_PROCESSOR_CONNS: "100"
      PROCESSOR_TIMEOUT_MS: "10000"
      PROCESSING_LEASE_MS: "25000"
      PROCESSOR_HEALTH_GRACE_MS: "1200"
      FALLBACK_QUEUE_SIZE: "200"
      PROCESSOR_DEFAULT_URL: "http://payment-processor-default:8080"
      PROCESSOR_FALLBACK_URL: "http://payment-processor-fallback:8080"
    depends_on:
      - valkey
    networks:
      - backend
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "80MB"

  valkey:
    container_name: valkey
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "150MB"

networks:
  backend:
    driver: bridge
  payment-processor:
    external: true
